name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /mine/myluna.web.id

            echo "=== Pull latest code ==="
            git pull origin main

            echo "=== Build Backend ==="
            cd /mine/myluna.web.id/backend
            npm install --production=false
            npm run build
            pm2 restart app_background_luna --update-env

            echo "=== Build Frontend ==="
            cd /mine/myluna.web.id/frontend
            npm install --production=false
            npm run build
            pm2 restart luna-frontend --update-env

            echo "=== Done ==="
            pm2 list
