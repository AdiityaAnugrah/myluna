name: Deploy to VPS

on:
  # Production deployment is deliberate; pushing code must not mutate production.
  workflow_dispatch:
    inputs:
      apply_verified_mt120:
        description: 'Verify master IDs with SELECT and merge the confirmed MT120 mapping into backend configuration'
        type: boolean
        required: true
        default: false
      quarantine_invalid_mapping:
        description: 'Privately archive non-UUID legacy entries; never infer their product identity'
        type: boolean
        required: true
        default: false

concurrency:
  group: myluna-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            # Load nvm & set PATH so pm2/node/npm are found
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/root/.nvm/versions/node/v22.13.0/bin:/usr/local/bin:/usr/bin

            echo "=== Pull latest code ==="
            cd /mine/myluna.web.id
            git pull origin main

            echo "=== Build Backend ==="
            cd /mine/myluna.web.id/backend
            npm ci --include=dev
            npm run build
            # Schema/data maintenance requires a separate reviewed operation,
            # verified backup and staging restore test. Never run it on deploy.
            if [ "${{ inputs.apply_verified_mt120 }}" = "true" ]; then
              if [ "${{ inputs.quarantine_invalid_mapping }}" = "true" ]; then
                node scripts/verifyWebsiteIdentityRelease.cjs --apply-verified-mt120 --quarantine-invalid-map
              else
                node scripts/verifyWebsiteIdentityRelease.cjs --apply-verified-mt120
              fi
            fi
            pm2 restart luna-backend --update-env
            pm2 restart app_background_lunarea --update-env || true

            echo "=== Build Frontend ==="
            cd /mine/myluna.web.id/frontend
            npm ci --include=dev
            npm run build
            pm2 restart luna-frontend --update-env

            echo "=== Done ==="
            git -C /mine/myluna.web.id rev-parse HEAD
            pm2 list
