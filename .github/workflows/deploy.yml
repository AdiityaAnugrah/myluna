name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e

            # Load nvm & set PATH so pm2/node/npm are found
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/root/.nvm/versions/node/v22.13.0/bin:/usr/local/bin:/usr/bin

            echo "=== Pull latest code ==="
            cd /mine/myluna.web.id
            git pull origin main

            echo "=== Build Backend ==="
            cd /mine/myluna.web.id/backend
            npm install --production=false
            npm run build
            npm run migrate:production
            npm run seed:regions:v2:production
            npm run reconcile:regions:v2:production
            pm2 restart app_background_lunarea --update-env

            echo "=== Build Frontend ==="
            cd /mine/myluna.web.id/frontend
            npm install --production=false
            npm run build
            pm2 restart luna-frontend --update-env

            echo "=== Done ==="
            pm2 list
